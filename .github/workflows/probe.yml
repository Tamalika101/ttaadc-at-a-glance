name: Probe data sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check each source from a GitHub runner
        run: |
          check() {
            out=$(curl -sS -L -o /tmp/body -w "%{http_code} %{size_download}B %{time_total}s" --max-time 60 -A "Mozilla/5.0" "$2" 2>&1) || true
            echo "| $1 | $out |" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          echo "| Source | Result (HTTP code, bytes, seconds) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          check "JJM dashboard" "https://ejalshakti.gov.in/jjmreport/JJMIndia.aspx"
          check "JJM village report (J7)" "https://ejalshakti.gov.in/JJM/JJMReports/Physical/JJMRep_VillageWiseFHTCCoverage.aspx"
          check "LGD directory" "https://lgdirectory.gov.in/"
          check "MGNREGA reports (nreganarep)" "https://nreganarep.nic.in/netnrega/MISreport4.aspx"
          check "MGNREGA home (nrega.nic.in)" "https://nrega.nic.in/"
          check "State Election Commission Tripura" "https://sec.tripura.gov.in/"
          check "TTAADC website" "https://ttaadc.gov.in/"
          check "Tripura gov portal" "https://tripura.gov.in/"
          check "data.gov.in" "https://www.data.gov.in/"
          check "dataful.in" "https://dataful.in/"
